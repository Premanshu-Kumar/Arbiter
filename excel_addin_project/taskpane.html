
<!-- taskpane.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-Agent Data Analyst</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .taskpane {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #2b579a;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .input-section {
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      resize: vertical;
    }
    button {
      background-color: #2b579a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #1e3e6e;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .error {
      color: #d9534f;
      background-color: #f2dede;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .results {
      margin-top: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    table, th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #2b579a;
      color: white;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
